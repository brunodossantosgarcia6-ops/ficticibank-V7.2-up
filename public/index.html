<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FictiBank V7.2</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--p:#6d28d9;--p2:#8b5cf6;--bg:#f5f3ff;--card:#fff;--text:#17131f;--muted:#756e80;--ok:#16803c;--danger:#c62828}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#f5f3ff,#fff);color:var(--text)}
button,input{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.screen{min-height:100vh}.auth{display:flex;align-items:center;justify-content:center;padding:22px}.auth-card{width:min(430px,100%);background:#fff;border-radius:28px;padding:30px;box-shadow:0 18px 60px #43208a22}
.logo{font-weight:900;font-size:28px;color:var(--p);margin-bottom:8px}.sub{color:var(--muted);margin-bottom:24px}
label{font-size:13px;font-weight:700;color:#625b6b;display:block;margin:14px 0 7px}
input{width:100%;padding:14px 15px;border:1px solid #e6e0ee;border-radius:14px;outline:0;background:#fbfaff}input:focus{border-color:var(--p2);box-shadow:0 0 0 4px #8b5cf622}
.primary{width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));color:white;font-weight:800;margin-top:18px}
.link{background:none;color:var(--p);font-weight:800;margin-top:14px;width:100%}
.demo{font-size:12px;color:var(--muted);margin-top:16px;text-align:center}.err{background:#ffe8e8;color:#9b2020;padding:10px;border-radius:12px;margin-top:14px;font-size:13px}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:92px}.top{padding:22px 20px 10px;display:flex;justify-content:space-between;align-items:center}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font-weight:900}
.hello{font-size:13px;color:var(--muted)}.name{font-size:20px;font-weight:900}.bell{background:#fff;border:1px solid #eee6f5;border-radius:14px;padding:11px;position:relative}
.dot{position:absolute;width:9px;height:9px;background:#ff3b57;border-radius:50%;right:7px;top:7px}
.balance{margin:12px 18px;padding:23px;border-radius:25px;background:linear-gradient(135deg,#4c1d95,#8b5cf6);color:white;box-shadow:0 16px 35px #6d28d933}
.balance small{opacity:.8}.money{font-size:32px;font-weight:900;margin-top:6px}.pixkey{font-size:12px;opacity:.9;margin-top:9px;word-break:break-all}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 18px}.action{background:#fff;border:1px solid #eee7f5;border-radius:17px;padding:14px 5px;text-align:center;font-weight:800;font-size:12px}.action span{display:block;font-size:21px;margin-bottom:6px}
.card{margin:10px 18px;padding:20px;border-radius:23px;background:linear-gradient(135deg,#17131f,#4b3a5c);color:#fff;min-height:190px;position:relative;overflow:hidden}.card:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-70px;top:-70px;background:#ffffff18}.chip{width:38px;height:28px;border-radius:8px;background:linear-gradient(135deg,#e7c98b,#fff0b5);margin-bottom:25px}.cardnum{letter-spacing:2px;font-size:18px}.cardfoot{display:flex;justify-content:space-between;margin-top:20px;font-size:11px;opacity:.9}
.section{padding:10px 18px}.section h2{font-size:17px;margin:12px 0}.row{background:#fff;border:1px solid #eee7f5;border-radius:17px;padding:15px;display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}.row .left{display:flex;gap:11px;align-items:center}.ico{width:38px;height:38px;border-radius:13px;background:#f0eaff;display:grid;place-items:center}.muted{color:var(--muted);font-size:12px}.plus{color:var(--ok);font-weight:900}.minus{color:var(--danger);font-weight:900}
.chartbox{background:#fff;border:1px solid #eee7f5;border-radius:19px;padding:15px;height:260px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid #eee7f5;display:grid;grid-template-columns:repeat(4,1fr);padding:10px 10px calc(10px + env(safe-area-inset-bottom));z-index:5}.nav{background:none;color:#8a8292;font-size:11px;font-weight:800}.nav.active{color:var(--p)}.nav span{display:block;font-size:19px;margin-bottom:3px}
.modal{position:fixed;inset:0;background:#170b2433;display:flex;align-items:end;justify-content:center;z-index:20}.sheet{background:#fff;width:min(520px,100%);border-radius:25px 25px 0 0;padding:23px;max-height:90vh;overflow:auto}.sheet h3{margin-top:0}.close{float:right;background:#f0ebf4;border-radius:50%;width:34px;height:34px}
.loading{position:fixed;inset:0;background:#170b2466;display:grid;place-items:center;z-index:30}.loader{background:#fff;border-radius:25px;padding:30px;text-align:center;min-width:230px}.spinner{width:42px;height:42px;border:4px solid #e7def2;border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#21172a;color:#fff;padding:13px 17px;border-radius:14px;z-index:40;font-size:13px;box-shadow:0 10px 30px #0003;max-width:90%}
.receipt{background:#faf8ff;border:1px dashed #cfc2df;border-radius:17px;padding:16px}.receipt .big{text-align:center;font-size:28px;font-weight:900;color:var(--p);margin:10px}
@media(min-width:700px){.app{box-shadow:0 0 50px #43208a18;background:var(--bg)}}
</style>
</head>
<body>
<div id="auth" class="screen auth">
  <div class="auth-card">
    <div class="logo">FictiBank</div>
    <div class="sub">V7.2 • banco fictício online</div>
    <div id="loginBox">
      <h2>Entrar</h2>
      <label>Nome de usuário</label><input id="loginUser" autocomplete="username" placeholder="ex.: bruno">
      <label>Senha</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Sua senha">
      <button class="primary" onclick="login()">Entrar</button>
      <button class="link" onclick="showRegister()">Criar uma conta</button>
      <div class="demo">Conta de teste: Bruno / senha Bruno*1902</div>
    </div>
    <div id="registerBox" class="hidden">
      <h2>Criar conta</h2>
      <label>Nome de usuário</label><input id="regUser" placeholder="ex.: joao">
      <label>Nome</label><input id="regName" placeholder="Como quer aparecer">
      <label>Senha</label><input id="regPass" type="password" placeholder="mínimo 6 caracteres">
      <button class="primary" onclick="register()">Criar conta</button>
      <button class="link" onclick="showLogin()">Já tenho conta</button>
    </div>
    <div id="authErr" class="err hidden"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <div class="top">
    <div><div class="hello">Olá,</div><div id="displayName" class="name"></div></div>
    <button class="bell" onclick="openNotifications()">🔔<span id="dot" class="dot hidden"></span></button>
  </div>
  <div class="balance"><small>Saldo disponível</small><div id="balance" class="money">R$ 0,00</div><div id="pixKey" class="pixkey"></div></div>

  <div class="actions">
    <button class="action" onclick="openPix()"><span>💸</span>Pix</button>
    <button class="action" onclick="openQr()"><span>▣</span>Meu QR</button>
    <button class="action" onclick="addMoney()"><span>➕</span>Adicionar</button>
    <button class="action" onclick="openCard()"><span>💳</span>Cartão</button>
  </div>

  <div class="card">
    <div class="chip"></div><div class="cardnum">•••• •••• •••• <span id="last4">7421</span></div>
    <div class="cardfoot"><span>FictiBank</span><span>12/30</span><span>•••</span></div>
  </div>

  <div class="section"><h2>Resumo</h2><div class="chartbox"><canvas id="chart"></canvas></div></div>
  <div class="section"><h2>Últimas movimentações</h2><div id="txList"></div></div>
  <div class="section"><h2>Conta</h2><div class="row"><div class="left"><div class="ico">👤</div><div><b id="accountUser"></b><div class="muted" id="accountPix"></div></div></div><button onclick="logout()">Sair</button></div></div>

  <div class="bottom"><button class="nav active"><span>⌂</span>Início</button><button class="nav" onclick="openPix()"><span>↗</span>Pix</button><button class="nav" onclick="openQr()"><span>▣</span>QR</button><button class="nav" onclick="openNotifications()"><span>🔔</span>Alertas</button></div>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div id="loading" class="loading hidden"><div class="loader"><div class="spinner"></div><div style="margin-top:14px;font-weight:900">Enviando Pix...</div><div class="muted" style="margin-top:6px">Aguarde um instante</div></div></div>
<div id="toast" class="toast hidden"></div>

<script>
let currentUser=null, chart=null, lastData=null;

function money(v){return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.add("hidden"),2800);}
function showErr(msg){const e=document.getElementById("authErr");e.textContent=msg;e.classList.remove("hidden");}
function showLogin(){document.getElementById("loginBox").classList.remove("hidden");document.getElementById("registerBox").classList.add("hidden");document.getElementById("authErr").classList.add("hidden");}
function showRegister(){document.getElementById("loginBox").classList.add("hidden");document.getElementById("registerBox").classList.remove("hidden");document.getElementById("authErr").classList.add("hidden");}
async function api(url,opt={}){const r=await fetch(url,{headers:{"Content-Type":"application/json"},...opt});const d=await r.json();if(!r.ok)throw new Error(d.error||"Erro");return d;}

async function login(){
  try{
    const d=await api("/api/login",{method:"POST",body:JSON.stringify({username:document.getElementById("loginUser").value,password:document.getElementById("loginPass").value})});
    currentUser=d.user; localStorage.setItem("fb72_user",currentUser.id); openApp();
  }catch(e){showErr(e.message)}
}
async function register(){
  try{
    const d=await api("/api/register",{method:"POST",body:JSON.stringify({username:document.getElementById("regUser").value,displayName:document.getElementById("regName").value,password:document.getElementById("regPass").value})});
    currentUser=d.user; localStorage.setItem("fb72_user",currentUser.id); openApp(); toast("Conta criada com sucesso!");
  }catch(e){showErr(e.message)}
}
async function openApp(){
  document.getElementById("auth").classList.add("hidden");document.getElementById("app").classList.remove("hidden");await refresh();
}
async function refresh(){
  if(!currentUser)return;
  try{
    const d=await api("/api/account/"+currentUser.id);lastData=d;currentUser=d.user;
    document.getElementById("displayName").textContent=currentUser.displayName;
    document.getElementById("balance").textContent=money(currentUser.balance);
    document.getElementById("pixKey").textContent="Chave Pix: "+currentUser.pixKey;
    document.getElementById("accountUser").textContent="@"+currentUser.username;
    document.getElementById("accountPix").textContent=currentUser.pixKey;
    const unread=d.notifications.filter(x=>!x.read).length;document.getElementById("dot").classList.toggle("hidden",unread===0);
    renderTx(d.transactions);renderChart(d.transactions);
  }catch(e){toast(e.message)}
}
function renderTx(list){
  const box=document.getElementById("txList");box.innerHTML="";
  if(!list.length){box.innerHTML='<div class="muted">Nenhuma movimentação ainda.</div>';return}
  list.slice(0,8).forEach(t=>{
    const incoming=t.to_user_id===currentUser.id;
    const other=incoming?(t.from_name||"Adição de saldo"):(t.to_name||"Pix");
    const div=document.createElement("div");div.className="row";
    div.innerHTML=`<div class="left"><div class="ico">${incoming?"↓":"↑"}</div><div><b>${esc(other)}</b><div class="muted">${new Date(t.created_at).toLocaleString("pt-BR")} • ${esc(t.description||"Pix")}</div></div></div><div class="${incoming?"plus":"minus"}">${incoming?"+":"-"} ${money(t.amount)}</div>`;
    box.appendChild(div);
  });
}
function renderChart(tx){
  const incoming=tx.filter(t=>t.to_user_id===currentUser.id).reduce((a,t)=>a+Number(t.amount),0);
  const outgoing=tx.filter(t=>t.from_user_id===currentUser.id).reduce((a,t)=>a+Number(t.amount),0);
  const ctx=document.getElementById("chart");
  if(chart)chart.destroy();
  chart=new Chart(ctx,{type:"doughnut",data:{labels:["Entradas","Saídas"],datasets:[{data:[incoming,outgoing]}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}}}});
}
function closeModal(){document.getElementById("modal").classList.add("hidden");}
function setSheet(html){document.getElementById("sheet").innerHTML=html;document.getElementById("modal").classList.remove("hidden");}
function openPix(){
  setSheet(`<button class="close" onclick="closeModal()">×</button><h3>Enviar Pix fictício</h3>
  <label>Chave Pix</label><input id="pixKeyInput" placeholder="ex.: joao@fictibank">
  <label>Valor</label><input id="pixAmount" type="number" min="0.01" step="0.01" placeholder="0,00">
  <label>Descrição</label><input id="pixDesc" placeholder="Ex.: lanche">
  <button class="primary" onclick="sendPix()">Enviar Pix</button>`);
}
async function sendPix(){
  const amount=Number(document.getElementById("pixAmount").value);
  if(!amount||amount<=0)return toast("Digite um valor válido.");
  closeModal();document.getElementById("loading").classList.remove("hidden");
  await new Promise(r=>setTimeout(r,1100));
  try{
    const d=await api("/api/pix",{method:"POST",body:JSON.stringify({fromUserId:currentUser.id,pixKey:document.getElementById("pixKeyInput").value,amount,description:document.getElementById("pixDesc").value})});
    document.getElementById("loading").classList.add("hidden");currentUser=d.from;await refresh();openReceipt(d);toast("Pix enviado com sucesso!");
  }catch(e){document.getElementById("loading").classList.add("hidden");toast(e.message)}
}
function openReceipt(d){
  setSheet(`<button class="close" onclick="closeModal()">×</button><h3>Comprovante</h3>
  <div class="receipt"><div class="muted" style="text-align:center">Pix fictício enviado</div><div class="big">${money(d.amount)}</div>
  <p><b>Para:</b> ${esc(d.to.displayName)} (@${esc(d.to.username)})</p>
  <p><b>Chave:</b> ${esc(d.to.pixKey)}</p><p><b>Descrição:</b> ${esc(d.description||"Pix fictício")}</p>
  <p><b>ID:</b> ${esc(d.transactionId)}</p><p><b>Data:</b> ${new Date(d.createdAt).toLocaleString("pt-BR")}</p></div>`);
}
async function openQr(){
  try{const d=await api("/api/pix/qr?key="+encodeURIComponent(currentUser.pixKey));setSheet(`<button class="close" onclick="closeModal()">×</button><h3>Meu QR Pix fictício</h3><div style="text-align:center"><img src="${d.qr}" style="width:260px;max-width:80%;border-radius:16px"><p><b>${esc(d.name)}</b></p><div class="muted">${esc(d.pixKey)}</div><button class="primary" onclick="navigator.clipboard?.writeText('${esc(d.pixKey)}');toast('Chave copiada!')">Copiar chave</button></div>`)}
  catch(e){toast(e.message)}
}
async function openNotifications(){
  if(!lastData)return;
  const notes=lastData.notifications;
  setSheet(`<button class="close" onclick="closeModal()">×</button><h3>Notificações</h3>${notes.length?notes.map(n=>`<div class="row"><div><b>${esc(n.title)}</b><div class="muted">${esc(n.body)}<br>${new Date(n.created_at).toLocaleString("pt-BR")}</div></div></div>`).join(""):'<div class="muted">Nenhuma notificação.</div>'}`);
  await api("/api/notifications/read",{method:"POST",body:JSON.stringify({userId:currentUser.id})});document.getElementById("dot").classList.add("hidden");
}
function openCard(){setSheet(`<button class="close" onclick="closeModal()">×</button><h3>Cartão virtual</h3><div class="card" style="margin:10px 0"><div class="chip"></div><div class="cardnum">5321 9044 1188 <span>${String(currentUser.id).slice(-4)}</span></div><div class="cardfoot"><span>${esc(currentUser.displayName.toUpperCase())}</span><span>12/30</span><span>•••</span></div></div><div class="muted">Cartão exclusivamente fictício para a simulação.</div>`)}
async function addMoney(){
  const v=prompt("Quanto deseja adicionar de saldo fictício?");const amount=Number(String(v||"").replace(",","."));
  if(!amount)return;
  try{await api("/api/add-money",{method:"POST",body:JSON.stringify({userId:currentUser.id,amount})});toast("Saldo fictício adicionado!");await refresh()}catch(e){toast(e.message)}
}
function logout(){localStorage.removeItem("fb72_user");location.reload()}
(async()=>{const id=localStorage.getItem("fb72_user");if(id){try{const d=await api("/api/account/"+id);currentUser=d.user;openApp()}catch(_){localStorage.removeItem("fb72_user")}}})();
</script>
</body>
</html>
